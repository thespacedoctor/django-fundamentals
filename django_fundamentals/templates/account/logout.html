{% extends "django_fundamentals/base.html" %}
{% block title %}Log out{% endblock %}
{% block content %}
<h1 class="mb-6 text-2xl font-semibold">Log out</h1>
<p class="mb-4">Are you sure you want to log out?</p>
<form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Log out</button>
</form>
{% endblock %}
