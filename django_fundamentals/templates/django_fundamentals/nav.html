<nav class="border-b border-gray-200" x-data="{ open: false }">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/" class="font-semibold">{{ request.site.name|default:"Home" }}</a>

        <div class="flex items-center gap-4">
            {% if request.user.is_authenticated %}
                <span class="text-sm text-gray-600">{{ request.user }}</span>
                {% if request.user.is_staff %}
                    <a href="/admin/" class="text-sm text-blue-600 hover:underline">Admin</a>
                {% endif %}
                <a href="{% url 'account_logout' %}" class="text-sm text-blue-600 hover:underline">Log out</a>
            {% else %}
                <a href="{% url 'account_login' %}" class="text-sm text-blue-600 hover:underline">Log in</a>
                <a href="{% url 'account_signup' %}" class="text-sm text-blue-600 hover:underline">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>
