{% load allauth %}
<section class="mt-6 rounded-lg border border-line bg-raised p-5">
    <h2 class="text-base font-semibold tracking-tight text-ink">{% slot title %}{% endslot %}</h2>
    <div class="mt-3">{% slot body %}{% endslot %}</div>
    {% if slots.actions %}
        <div class="mt-4 flex flex-wrap gap-2">
            {% for action in slots.actions %}{{ action }}{% endfor %}
        </div>
    {% endif %}
</section>
